<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donttblink's Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="js.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1 class="turn"></h1>
      <div class="board"></div>
      <div>
        <form class="player-names">
          <div class="form-data">
            <div class="form-row">
              <label class="player-one">Player One</label>
              <input class="player-one-name" />
            </div>
            <div class="form-row">
              <label class="player-two">Player Two</label>
              <input class="player-two-name" />
            </div>
          </div>
        </form>
      </div>
      <button class="new-game">New Game</button>
    </div>
  </body>
</html>
